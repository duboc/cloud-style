<!doctype html>
<!--
  cloud-style — WORKING DEMO

  A complete four-screen deck rendered from content.js. Use this to check the
  system end to end, or fork it as the starting point for a real demo.

  Navigation:  click through, or use arrow keys / Escape / Home.
  Content:     edit content.js. Nothing else needs to change.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  viewport-fit=cover      enables env(safe-area-inset-*) on notched phones
  interactive-widget=...  makes the Android keyboard resize the layout rather
                          than cover it, which matters if you embed a chat
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>cloud-style — Google Cloud demo deck template</title>
<meta name="theme-color" content="#3f7ae8">
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/cloud-style.css">
<script src="js/gc-icons.js"></script>
<script src="js/cloud-style.js"></script>
<script src="content.js"></script>
</head>

<body>

<div class="gc-cover">

  <div class="gc-progress-bar" aria-hidden="true"></div>

  <div class="gc-supercloud" aria-hidden="true">
    <img src="assets/supercloud.png" alt="" />
  </div>

  <div class="gc-veil" id="veil" aria-hidden="true" hidden></div>

  <div class="gc-stage">

    <div class="gc-wordmark">
      <div class="gc-wordmark-brand">
        <h1 id="wordmark"></h1>
        <span class="gc-status-chip"><span class="gc-status-dot"></span><span id="status-label"></span></span>
        <nav class="gc-app-nav">
          <button class="gc-nav-link active" data-go="cover"></button>
          <button class="gc-nav-link" data-go="menu"></button>
        </nav>
      </div>
    </div>

    <!-- Screens render into here. -->
    <div id="screen"></div>

    <div class="gc-footer">
      <div class="gc-footer-logo">
        <span>
          <span class="gc-g1">G</span><span class="gc-o1">o</span><span class="gc-o2">o</span><span class="gc-g2">g</span><span class="gc-l">l</span><span class="gc-e">e</span>
        </span>
        <span class="gc-cloud">Cloud</span>
      </div>
      <div class="gc-edition" id="edition"></div>
    </div>

  </div>
</div>

<script type="module">
import { startApp } from './js/app.js';
/* ---------------------------------------------------------------------------
   Router. Three states:
     {view:'cover'}
     {view:'menu'}
     {view:'cards',   cat}
     {view:'article', cat, fact}
   Each render() writes the whole screen; gcNavigate wraps it so the named
   regions cross-fade. The wordmark, ripple and footer live outside #screen
   and therefore never animate.
   ------------------------------------------------------------------------ */

/* --- demo component templates ------------------------------------------- */

function demoCamera(f) {
  return `
    <div class="gc-demo-app gc-demo-camera" id="gc-camera-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-camera"/></svg>
          Vision AI Scanner
        </span>
        <span class="gc-demo-chip">LIVE OCR</span>
      </div>
      <div class="gc-demo-body">
        <div class="gc-camera-viewfinder" id="camera-viewfinder">
          <div class="gc-camera-grid"></div>
          <div class="gc-camera-scanline"></div>
          <div class="gc-camera-reticle">
            <span class="gc-camera-target-tag">
              <svg style="width:2.2cqw;height:2.2cqw"><use href="#gc-icon-sparkle"/></svg>
              Gemini Vision: 99.4%
            </span>
          </div>
        </div>
        <div class="gc-camera-controls">
          <button class="gc-icon-btn" style="width:8cqw;height:8cqw" aria-label="Mode">
            <svg><use href="#gc-icon-catalog"/></svg>
          </button>
          <button class="gc-camera-shutter" id="camera-shutter-btn" aria-label="Capture">
            <svg><use href="#gc-icon-camera"/></svg>
          </button>
          <button class="gc-icon-btn" style="width:8cqw;height:8cqw" aria-label="Flash">
            <svg><use href="#gc-icon-sparkle"/></svg>
          </button>
        </div>
        <div class="gc-camera-drawer" id="camera-results-drawer">
          <div class="gc-camera-drawer-header">
            <span>Extraction Result</span>
            <span class="gc-demo-status-dot"></span>
          </div>
          <div class="gc-camera-drawer-row">
            <span>Target Object</span>
            <span class="gc-camera-drawer-val" id="camera-doc-type">Documento Corporativo BR</span>
          </div>
          <div class="gc-camera-drawer-row">
            <span>Inference Latency</span>
            <span class="gc-camera-drawer-val" id="camera-latency">18ms (TPU Ironwood)</span>
          </div>
          <div class="gc-camera-drawer-row">
            <span>Grounding Safety</span>
            <span class="gc-camera-drawer-val" style="color:var(--gc-google-green)">PASSED · 0 Filter Hit</span>
          </div>
        </div>
      </div>
    </div>`;
}

function demoVideo(f) {
  return `
    <div class="gc-demo-app gc-demo-video" id="gc-video-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-video"/></svg>
          Cloud Summit Brasil Stream
        </span>
        <span class="gc-demo-chip">1080p · 60fps</span>
      </div>
      <div class="gc-demo-body">
        <div class="gc-video-player" id="video-player-box">
          <div class="gc-video-top">
            <span class="gc-video-badge">
              <span class="gc-video-badge-dot"></span>
              ON AIR
            </span>
            <button class="gc-icon-btn" style="width:6cqw;height:6cqw;color:#fff;background:rgba(255,255,255,0.15)" aria-label="Volume">
              <svg><use href="#gc-icon-volume"/></svg>
            </button>
          </div>
          <div class="gc-video-center">
            <button class="gc-video-play-btn" id="video-toggle-btn" aria-label="Play/Pause">
              <svg id="video-play-icon"><use href="#gc-icon-play"/></svg>
            </button>
          </div>
          <div class="gc-video-bottom">
            <div class="gc-video-timeline-bar" id="video-timeline">
              <div class="gc-video-timeline-fill" id="video-progress" style="width:42%"></div>
            </div>
            <div class="gc-video-time-row">
              <span id="video-time-elapsed">05:14</span>
              <span>12:30</span>
            </div>
          </div>
        </div>
        <div class="gc-video-chapters-title">AI Video Chapters</div>
        <div class="gc-video-chapter-card is-active" data-time="00:00" data-pct="10">
          <span>01 · Keynote: A Empresa Agêntica</span>
          <span class="gc-video-chapter-time">00:00</span>
        </div>
        <div class="gc-video-chapter-card" data-time="04:20" data-pct="42">
          <span>02 · Live Demo: Gemini 3.1 & Agent Builder</span>
          <span class="gc-video-chapter-time">04:20</span>
        </div>
        <div class="gc-video-chapter-card" data-time="08:45" data-pct="70">
          <span>03 · Cloud Space SP & Gemma 3 PT</span>
          <span class="gc-video-chapter-time">08:45</span>
        </div>
      </div>
    </div>`;
}

function demoChat(f) {
  return `
    <div class="gc-demo-app gc-demo-chat" id="gc-chat-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-sparkle"/></svg>
          Gemini 3.1 Agent
        </span>
        <span class="gc-demo-status-dot" title="Online"></span>
      </div>
      <div class="gc-demo-body" id="chat-body">
        <div class="gc-chat-stream" id="chat-stream">
          <div class="gc-chat-msg is-agent">
            Olá! Sou o assistente de IA do Google Cloud Summit Brasil. Como posso ajudar com a sua Empresa Agêntica hoje?
          </div>
          <div class="gc-chat-msg is-user">
            Analisar a escalabilidade dos agentes Gemini 3.1 Pro no Vertex AI.
          </div>
          <div class="gc-chat-msg is-agent">
            Telemetria do Vertex AI Agent Builder verificada em tempo real.
            <div class="gc-chat-tool-badge">
              <svg><use href="#gc-icon-sparkle"/></svg>
              VertexAI Tool: AgentExecutor.query()
            </div>
            Agentes operando com 100% de precisão de grounding. Latência P99 de 14ms em São Paulo.
          </div>
        </div>
      </div>
      <div class="gc-chat-pills" id="chat-pills">
        <button class="gc-prompt-pill" data-prompt="Escalar agentes no Vertex AI">Agentes Vertex AI</button>
        <button class="gc-prompt-pill" data-prompt="Auditar custos no BigQuery">Auditoria BigQuery</button>
        <button class="gc-prompt-pill" data-prompt="Verificar postura Zero Trust">Zero Trust Gate</button>
      </div>
      <div class="gc-chat-input-bar">
        <button class="gc-icon-btn" style="width:7cqw;height:7cqw" aria-label="Voice">
          <svg><use href="#gc-icon-mic"/></svg>
        </button>
        <input type="text" class="gc-chat-input" id="chat-input" placeholder="Pergunte ao Gemini..." />
        <button class="gc-chat-btn-send" id="chat-send-btn" aria-label="Send">
          <svg><use href="#gc-icon-send"/></svg>
        </button>
      </div>
    </div>`;
}

function demoMetrics(f) {
  return `
    <div class="gc-demo-app gc-demo-metrics" id="gc-metrics-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-database"/></svg>
          BigQuery Studio
        </span>
        <span class="gc-demo-chip">1,280 SLOTS</span>
      </div>
      <div class="gc-demo-body">
        <div class="gc-metrics-codebox">
          <span class="gc-sql-kw">SELECT</span> region, <span class="gc-sql-fn">COUNT</span>(*) <span class="gc-sql-kw">AS</span> reqs,<br>
          &nbsp;&nbsp;<span class="gc-sql-fn">AVG</span>(latency_ms) <span class="gc-sql-kw">AS</span> p99<br>
          <span class="gc-sql-kw">FROM</span> <span class="gc-sql-tbl">\`cloud_summit_br.telemetry\`</span><br>
          <span class="gc-sql-kw">GROUP BY</span> region <span class="gc-sql-kw">ORDER BY</span> reqs <span class="gc-sql-kw">DESC</span>;
        </div>
        <button class="gc-metrics-run-btn" id="metrics-run-btn">
          <svg><use href="#gc-icon-play"/></svg>
          <span id="metrics-run-text">Run Query (0.42s)</span>
        </button>
        <div class="gc-metrics-kpi-grid">
          <div class="gc-kpi-card">
            <span class="gc-kpi-label">Throughput</span>
            <span class="gc-kpi-val" id="kpi-throughput">48.2k/s</span>
            <span class="gc-kpi-trend">↑ +14.2%</span>
          </div>
          <div class="gc-kpi-card">
            <span class="gc-kpi-label">P99 Latency</span>
            <span class="gc-kpi-val" id="kpi-latency">12ms</span>
            <span class="gc-kpi-trend" style="color:var(--gc-google-green)">✓ Optimal</span>
          </div>
          <div class="gc-kpi-card">
            <span class="gc-kpi-label">Processed</span>
            <span class="gc-kpi-val">1.8 TB</span>
            <span class="gc-kpi-trend">Cached</span>
          </div>
          <div class="gc-kpi-card">
            <span class="gc-kpi-label">Slot Capacity</span>
            <span class="gc-kpi-val">98.4%</span>
            <span class="gc-kpi-trend" style="color:var(--gc-blue-action)">Autoscaled</span>
          </div>
        </div>
      </div>
    </div>`;
}

function demoSecurity(f) {
  return `
    <div class="gc-demo-app gc-demo-security" id="gc-security-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-shield"/></svg>
          BeyondCorp Gate
        </span>
        <span class="gc-demo-chip">ZERO TRUST</span>
      </div>
      <div class="gc-demo-body">
        <div class="gc-security-hero">
          <div class="gc-security-shield-icon" id="security-shield">
            <svg><use href="#gc-icon-shield"/></svg>
          </div>
          <span class="gc-security-status-title" id="security-status-text">Identity Verified</span>
          <span style="font-size:2.4cqw;color:var(--gc-ink-600)">Titan FIDO2 · Contextual Access</span>
        </div>
        <div class="gc-security-item">
          <span>Device Health Attestation</span>
          <div class="gc-security-check-icon"><svg><use href="#gc-icon-check"/></svg></div>
        </div>
        <div class="gc-security-item">
          <span>IAM Context Policy: southamerica-east1</span>
          <div class="gc-security-check-icon"><svg><use href="#gc-icon-check"/></svg></div>
        </div>
        <div class="gc-security-item">
          <span>Threat Defense / SCC Premium + Wiz</span>
          <div class="gc-security-check-icon"><svg><use href="#gc-icon-check"/></svg></div>
        </div>
        <button class="gc-metrics-run-btn" style="margin-top:auto" id="security-verify-btn">
          <svg><use href="#gc-icon-shield"/></svg>
          <span>Re-evaluate Posture</span>
        </button>
      </div>
    </div>`;
}

function demoButtons(f) {
  return `
    <div class="gc-demo-app gc-demo-buttons" id="gc-buttons-demo">
      <div class="gc-demo-topbar">
        <span class="gc-demo-topbar-title">
          <svg><use href="#gc-icon-catalog"/></svg>
          Cloud UI Kit
        </span>
        <span class="gc-demo-chip">CONTROLS</span>
      </div>
      <div class="gc-demo-body">
        <div class="gc-controls-group">
          <span class="gc-controls-label">Interactive Buttons</span>
          <div class="gc-controls-row">
            <button class="gc-btn" style="padding:1.8cqw 3.5cqw;font-size:2.8cqw" id="demo-action-btn">Action</button>
            <button class="gc-btn--tonal" id="demo-tonal-btn">Tonal</button>
          </div>
        </div>
        <div class="gc-controls-group">
          <span class="gc-controls-label">Segmented Switch</span>
          <div class="gc-segmented" id="demo-segmented">
            <button class="gc-segmented-btn is-selected" data-val="standard">Standard</button>
            <button class="gc-segmented-btn" data-val="enterprise">Enterprise</button>
            <button class="gc-segmented-btn" data-val="gemini">Gemini AI</button>
          </div>
        </div>
        <div class="gc-controls-group">
          <span class="gc-controls-label">Toggle Controls</span>
          <div class="gc-switch-row">
            <span>GKE Autoscale</span>
            <div class="gc-switch is-on" id="demo-switch-1">
              <div class="gc-switch-thumb"></div>
            </div>
          </div>
          <div class="gc-switch-row">
            <span>Zero Trust Enforcement</span>
            <div class="gc-switch is-on" id="demo-switch-2">
              <div class="gc-switch-thumb"></div>
            </div>
          </div>
        </div>
        <div class="gc-controls-group">
          <span class="gc-controls-label">Capacity Slider</span>
          <div class="gc-slider-row">
            <div class="gc-slider-top">
              <span>Max Instances</span>
              <span id="demo-slider-val" style="color:var(--gc-blue-action)">64 vCPU</span>
            </div>
            <input type="range" class="gc-slider-input" id="demo-slider" min="8" max="128" value="64" />
          </div>
        </div>
      </div>
    </div>`;
}

function demoHtml(type, f) {
  switch (type) {
    case 'camera':   return demoCamera(f);
    case 'video':    return demoVideo(f);
    case 'metrics':  return demoMetrics(f);
    case 'security': return demoSecurity(f);
    case 'buttons':  return demoButtons(f);
    default:         return demoChat(f);
  }
}

startApp({ content: window.CONTENT, demoHtml });
</script>
</body>
</html>
