<!doctype html>
<!--
  SCREEN 02 — MENU
  The index. A numbered list of categories, each with a glyph tile.

  Anatomy (desktop):
    menu block   left 3.3cqw  top 18cqw  width 42cqw  gap 1.05cqw
    row height   4.4cqw       radius 1.05cqw
    icon tile    3.3cqw square, radius 0.8cqw
    glyph        1.8cqw

  Rules of the menu:
    - Five to seven rows. Beyond that the list stops scanning as a menu.
    - Numbers are zero-padded ("01") and set in the muted blue, never black.
      They are ordinals, not data — they must not compete with the label.
    - The row is the hit target, not the label. Use a <button>.
    - Each category keeps its glyph forever: the same icon reappears in the
      breadcrumb on screens 03 and 04 so the user tracks where they are.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — cloud-style</title>
