<!doctype html>
<!--
  SCREEN 02 — MENU
  The index. A numbered list of categories, each with a glyph tile.

  Anatomy (desktop):
    menu block   left 3.3cqw  top 18cqw  width 42cqw  gap 1.05cqw
    row height   4.4cqw       radius 1.05cqw
    icon tile    3.3cqw square, radius 0.8cqw
    glyph        1.8cqw

  Rules of the menu:
    - Five to seven rows. Beyond that the list stops scanning as a menu.
    - Numbers are zero-padded ("01") and set in the muted blue, never black.
      They are ordinals, not data — they must not compete with the label.
    - The row is the hit target, not the label. Use a <button>.
    - Each category keeps its glyph forever: the same icon reappears in the
      breadcrumb on screens 03 and 04 so the user tracks where they are.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — cloud-style</title>
<meta name="theme-color" content="#3f7ae8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/cloud-style.css">
<script src="../js/gc-icons.js"></script>
</head>

<body>
<div class="gc-cover">

  <div class="gc-progress-bar" aria-hidden="true"></div>

  <div class="gc-supercloud" aria-hidden="true">
    <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gc-sc-grad" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ea4335" />
          <stop offset="30%" stop-color="#fbbc05" />
          <stop offset="65%" stop-color="#34a853" />
          <stop offset="100%" stop-color="#4285f4" />
        </linearGradient>
      </defs>
      <path d="M 194 340 L 330 340 A 55 55 0 0 0 385 285 A 55 55 0 0 0 330 230 A 55 55 0 0 0 316 232 A 80 80 0 0 0 170 180 A 80 80 0 0 0 162 202 A 65 65 0 0 0 110 255 A 65 65 0 0 0 175 320 L 220 320 A 25 25 0 0 0 245 295 A 25 25 0 0 0 220 270 L 190 270" stroke="url(#gc-sc-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <div class="gc-stage">

    <div class="gc-wordmark">
      <h1><b>Summit </b><span>Brasil</span></h1>
    </div>

    <nav class="gc-menu" style="view-transition-name: gc-menu">

      <button class="gc-menu-item">
        <span class="gc-icon-tile"><svg><use href="#gc-icon-identity"/></svg></span>
        <span class="gc-menu-label">Agentes de IA e Empresa Agêntica</span>
        <span class="gc-menu-num">01</span>
      </button>

      <button class="gc-menu-item">
        <span class="gc-icon-tile"><svg><use href="#gc-icon-catalog"/></svg></span>
        <span class="gc-menu-label">Infraestrutura Moderna e AI Hypercomputer</span>
        <span class="gc-menu-num">02</span>
      </button>

      <button class="gc-menu-item">
        <span class="gc-icon-tile"><svg><use href="#gc-icon-support"/></svg></span>
        <span class="gc-menu-label">Dados Unificados e Inteligência em Tempo Real</span>
        <span class="gc-menu-num">03</span>
      </button>

      <button class="gc-menu-item">
        <span class="gc-icon-tile"><svg><use href="#gc-icon-mobile-check"/></svg></span>
        <span class="gc-menu-label">Segurança com IA e BeyondCorp Zero Trust</span>
        <span class="gc-menu-num">04</span>
      </button>

      <button class="gc-menu-item">
        <span class="gc-icon-tile"><svg><use href="#gc-icon-open"/></svg></span>
        <span class="gc-menu-label">Inovação Local e Ecossistema Brasil</span>
        <span class="gc-menu-num">05</span>
      </button>

    </nav>

    <div class="gc-footer">
      <div class="gc-footer-logo">
        <span>
          <span class="gc-g1">G</span><span class="gc-o1">o</span><span class="gc-o2">o</span><span class="gc-g2">g</span><span class="gc-l">l</span><span class="gc-e">e</span>
        </span>
        <span class="gc-cloud">Cloud</span>
      </div>
      <div class="gc-edition">Google Cloud Summit Brasil 2026</div>
    </div>

  </div>
</div>
</body>
</html>
